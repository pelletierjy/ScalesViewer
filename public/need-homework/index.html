<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>AI Homework Chatbot</title>

    <link rel="stylesheet" crossorigin href="/need-homework/assets/index-CRqnw2kE.css">

  <body>
    <div id="app"></div>
    <script>
      (function () {
        var redirect = sessionStorage.getItem('gh_pages_redirect');
        if (redirect) {
          sessionStorage.removeItem('gh_pages_redirect');
          if (redirect !== location.href) {
            history.replaceState(null, '', redirect);
          }
        }
      })();
    </script>
  </body>
